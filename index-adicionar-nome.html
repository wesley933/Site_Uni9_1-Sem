<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style-Adicionar-nome.css">
    <title>formularioNome</title>
</head>





<body >

     <header>
            <a href="#" class="cabecalho-logo">
                <img src="../img/TRABALHO UNI9 LOGO.jpeg" alt="logo">
             </a>


            <div class="h1-cadastrar">
                <h1>CADASTRAR</h1>
            </div>

           
            <a href="index.html" class="cabecalho-voltar">
                 <img src="../img/LOGOCasaUni9.PNG" alt="voltar">
            </a>

    </header>

    

         <main>

            <div class="main-globo">

                <form action="index-masculino.html">

                    <h1 class="text-cadastro">DADOS PESSOAIS</h1>
                
                    <div class="formulario-respostas">
                        <label for="Nome"></label>
                        <input id="Nome" type="text" name="Nome" placeholder="Digite o Nome" required>
                    </div>


                    <div class="formulario-respostas">
                        <label for="idade"></label>
                        <input id="idade" type="number" name="idade" placeholder="Digite a Idade " required>
                    </div>


                    <div class="formulario-respostas">
                        <label for="email"></label>
                        <input id="email" type="email" name="email" placeholder="Digite o Email" required>
                    </div>


                    <div class="formulario-respostas">
                        <label for=""></label>
                        <input id="telefone" type="number" name="telefone" placeholder="Digite o Telefone" required>
                    </div>


                    <div class="formulario-respostas">
                        <label for=""></label>
                        <input id="Cargo" type="text" name="Cargo" placeholder="Digite o Cargo" required>
                    </div>


                    <div class="formulario-respostas">

                       
                        <input list="regioes-id" placeholder="Escolha a Região" required>
                        <datalist id="regioes-id">
                            <option value="Norte">Norte</option>
                            <option value="Leste">Leste</option>
                            <option value="Sudeste">Sudeste</option>
                            <option value="Oeste">Oeste</option>
                            <option value="Sudoeste">Sudoeste</option>
                        </datalist>

                    </div>
                   


                        <h6>GÊNERO</h6>
                        
                        <div class="generos-input">
                            <input type="radio" id="masculino" name="gender">
                            <label for="masculino">Masculino</label>
                        </div>

                        <div class="generos-input">
                            <input type="radio" id="feminino" name="gender" >
                            <label for="feminino">Feminino</label>
                        </div>                       
     

                    
                        <button class="cadastrar-botao">CADASTRAR</button>
                   

                

                </form>

            </div>
        </main>
    
        

    

















</body>
</html>
